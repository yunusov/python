[project]
name = "scoring-api"
version = "0.1.0"
description = "OTUS.Python Pro"
readme = "README.md"
authors = [
    { name = "v.yunusov", email = "v300187@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "logging>=0.4.9.6",
]

[project.scripts]
scoring-api = "scoring_api.main:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest (>=8.0.0,<9.0.0)",
    "ruff (>=0.16.6,<0.17.0)"
]

[tool.pytest.ini_options]
testpaths = ["test"]
