<html>
<header>
  <style>
    td, th {
      text-align: center;
      vertical-align: middle;
    }
    .url-col { text-align: left; }
  </style>
</header>
<body>
<table id="myTable" class="tablesorter" border=1>
  <thead>
    <tr>
      <th>URL</th>
      <th>count</th>
      <th>count_perc</th>
      <th>time_sum</th>
      <th>time_perc</th>
      <th>time_avg</th>
      <th>time_max</th>
      <th>time_med</th>
    </tr>
  </thead>
  <tbody id="tableBody">
  </tbody>
</table>

<script src="./static/jquery.min.js"></script>
<script src="./static/jquery.tablesorter.min.js"></script>
<script type="text/javascript">
  $(document).ready(function() {
    var tableData = $table_json;

    var tbody = document.getElementById("tableBody");
    tableData.forEach(function(item) {
      var tr = document.createElement("tr");

      var cells = [
        item.URL,
        item.count,
        item.count_perc,
        item.time_sum,
        item.time_perc,
        item.time_avg,
        item.time_max,
        item.time_med
      ];

      cells.forEach(function(value, i) {
        var td = document.createElement("td");
        if (i === 0) {
          td.className = "url-col";  // левое выравнивание URL
        }
        td.textContent = value;      // безопасная вставка без HTML-инъекций
        tr.appendChild(td);
      });

      tbody.appendChild(tr);
    });

    // Инициализируем сортировку ПОСЛЕ заполнения строк
    $("#myTable").tablesorter({sortList: [[0,0]]});
  });
</script>
</body>

</html>
