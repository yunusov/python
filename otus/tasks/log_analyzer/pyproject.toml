[project]
name = "log-analyzer"
version = "0.1.0"
description = "OTUS.Python Pro.HW#1"
authors = [
    {name = "v.yunusov",email = "v300187@yandex.ru"}
]
requires-python = ">=3.14"
dependencies = [
    "structlog (>=26.1.0,<27.0.0)",
    "colorama (>=0.4.6,<0.5.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
main-run = "log_analyzer.main:main"