[project]
name = "django-pro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "v.yunusov", email = "v300187@yandex.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.2",
    "djangorestframework>=3.18.3",
    "loguru>=0.7.3",
    "pydantic-settings>=2.16.1",
    "whitenoise>=6.12.0",
    "gunicorn>=23.0.0",
    "psycopg2-binary>=2.9.13",
    "django-redis>=7.0.0",
    "python-json-logger>=4.2.0",
]

[project.scripts]
django-pro = "django_pro:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
