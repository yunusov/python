<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Блог{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
          rel="stylesheet"
          id="bootstrap-css"
          onerror="loadBootstrapFallback();"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"/>
    <script>
        function loadBootstrapFallback() {
            // Подменяем CDN на локальный файл
            var link = document.getElementById('bootstrap-css');
            link.href = '/static/css/bootstrap.min.css';
            
            // Добавляем JS fallback
            var script = document.createElement('script');
            script.src = '/static/js/bootstrap.bundle.min.js';
            document.head.appendChild(script);
        }
    </script>
</head>
<body>
    <header>
        {% include 'include/menu.html' %}
    </header>


    <main>
        <div class="container mt-4">
          {% block content %}
          {% endblock %}
        </div>
    </main>


    <footer class="bg-dark text-white text-center py-3">
        <p>&copy; 2026 Blog App</p>
    </footer>

</body>
</html>
