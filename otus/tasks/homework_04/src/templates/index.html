{% extends 'base.html' %}

{% block content %}

<a href="/add/">Добавить запись</a>
&emsp;
<a href="/load/">Загрузить данные</a>

<table class="table table-striped table-hover w-100">
  <thead>
    <tr>
      <th scope="col">ID записи</th>
      <th scope="col">Имя пользователя</th>
      <th scope="col">Заголовок</th>
      <th scope="col">Содержимое</th>
    </tr>
  </thead>
  <tbody>
    {% for post in posts %}
    <tr>
      <th scope="row">{{ post.id }}</th>
      <td>{{ post.user }}</td>
      <td>{{ post.title }}</td>
      <td>{{ post.body }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>

{% endblock %}
